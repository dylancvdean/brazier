[workspace]
members = [
    "crates/brazier-agent",
    "crates/brazier-formats",
    "crates/brazier-protocol",
    "crates/brazier-runtime",
    "crates/brazier-storage",
    "crates/brazierd",
]
resolver = "2"

[profile.dev]
# `pnpm dev` spawns the daemon via `cargo run`, and the desktop UI stays blank
# until it prints BRAZIER_READY, so every second of rebuild is a second of dead
# startup. Full debuginfo costs ~40% of the incremental rebuild (6.6s -> 3.9s)
# and grows the binary from 215MB to 85MB. Line tables keep panic backtraces
# with file and line numbers; only debugger variable inspection is given up.
debug = "line-tables-only"

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/dylancvdean/brazier"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
