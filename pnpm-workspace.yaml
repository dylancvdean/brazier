packages:
  - apps/*
  - packages/*

# minimatch@10 pulls brace-expansion@5, which can fail pnpm 11's default
# minimumReleaseAge lockfile check until the release is 24h old.
overrides:
  minimatch@>=10.0.0: 9.0.9

# Allow install scripts for packages that need native binaries.
# (pnpm no longer reads package.json#pnpm.onlyBuiltDependencies)
onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  # Transitive dependencies of the Pi agent runtime, pulled in for provider SDKs
  # Brazier never calls (Agent mode talks to brazierd's local OpenAI-compatible
  # endpoint). Their install scripts only build optional native/protobuf assets.
  '@google/genai': false
  protobufjs: false

# The Pi agent runtime, added deliberately at a pinned version.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.82.1'
  - '@earendil-works/pi-ai@0.82.1'
