# Include the system defaults, then keep every makepkg artifact out of the
# checkout. Invoke with:
#   makepkg --config packaging/makepkg-local.conf -si
source /etc/makepkg.conf

BUILDDIR=/tmp/brazier-makepkg/build
PKGDEST=/tmp/brazier-makepkg/pkg
SRCDEST=/tmp/brazier-makepkg/sources
SRCPKGDEST=/tmp/brazier-makepkg/sources
LOGDEST=/tmp/brazier-makepkg/logs
