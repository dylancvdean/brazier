name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Agent sandbox tests need Bubblewrap; without it shell tools return empty.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version comes from package.json packageManager; specifying both here
        # and there makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --fail-if-no-match so a package rename breaks CI instead of silently
      # turning these steps into no-ops that still exit 0.
      - run: pnpm --filter @brazier/desktop --fail-if-no-match check
      - run: pnpm --filter @brazier/desktop --fail-if-no-match test
      - run: pnpm --filter @brazier/desktop --fail-if-no-match build
