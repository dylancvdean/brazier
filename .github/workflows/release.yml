name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

# Jobs start read-only. Upload jobs get only release write access; the final
# signing job alone gets an OIDC identity, not a long-lived Linux signing key.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          case "$tag" in v*) ;; *) echo "Release tags must start with v" >&2; exit 1;; esac
          root_version="$(node -p 'require("./package.json").version')"
          desktop_version="$(node -p 'require("./apps/desktop/package.json").version')"
          expected_root="v$root_version"
          expected_desktop="v$desktop_version"
          if [ "$tag" != "$expected_root" ] || [ "$tag" != "$expected_desktop" ]; then
            echo "Tag/version mismatch: tag=$tag, root=$expected_root, desktop=$expected_desktop" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A tag can be pushed without a preceding branch CI run. Re-run the core
  # quality gates against the exact tagged revision before spending time on
  # signing or publishing release artifacts.
  verify:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Install test toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --unshare-net --ro-bind / / --dev /dev --die-with-parent -- true
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm --filter @brazier/desktop check
      - run: pnpm --filter @brazier/desktop test
      - run: pnpm --filter @brazier/desktop build
      - run: pnpm qualification:test
      - run: pnpm qualification:voice-corpus

  macos:
    needs: [validate, verify]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - run: pnpm install --frozen-lockfile
      - name: Require macOS signing credentials
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Build signed and notarized Apple Silicon distribution
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BRAZIER_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          cargo build --release --locked -p brazierd -p brazier-safety
          pnpm --filter @brazier/desktop run build
          # The final publish job creates exactly one GitHub Release after both
          # platform builds and signatures are available. Publishing here would
          # create a draft that races that final release creation.
          pnpm --filter @brazier/desktop exec electron-builder --mac --arm64 --publish never
      - name: Smoke-test the application from the DMG
        env:
          BRAZIER_PACKAGE_SMOKE: '1'
          BRAZIER_PACKAGE_SMOKE_OUTPUT: ${{ runner.temp }}/qualification-results/macos-arm64-dmg.json
          BRAZIER_DATA_DIR: ${{ runner.temp }}/brazier-smoke-data
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-results" "$RUNNER_TEMP/brazier-smoke-user"
          hdiutil attach apps/desktop/dist/Brazier.dmg -mountpoint "$RUNNER_TEMP/brazier-dmg" -nobrowse
          trap 'hdiutil detach "$RUNNER_TEMP/brazier-dmg"' EXIT
          "$RUNNER_TEMP/brazier-dmg/Brazier.app/Contents/MacOS/brazier" \
            --user-data-dir="$RUNNER_TEMP/brazier-smoke-user"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          # Keep the installables and updater manifest. Blockmaps are only
          # useful for differential updates and otherwise add release noise;
          # builder-debug.yml is diagnostic output, not a release asset.
          path: |
            apps/desktop/dist/Brazier.dmg
            apps/desktop/dist/Brazier-*-arm64-mac.zip
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package-smoke
          path: ${{ runner.temp }}/qualification-results/macos-arm64-dmg.json
          if-no-files-found: error

  appimage:
    needs: [validate, verify]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - run: pnpm install --frozen-lockfile
      - name: Build AppImage distribution
        env:
          GH_TOKEN: ${{ github.token }}
          BRAZIER_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          cargo build --release --locked -p brazierd -p brazier-safety -p brazier-input-guard
          pnpm --filter @brazier/desktop run build
          pnpm --filter @brazier/desktop exec electron-builder --linux AppImage --x64 --publish never
      - name: Smoke-test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          BRAZIER_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
          BRAZIER_PACKAGE_SMOKE: '1'
          BRAZIER_PACKAGE_SMOKE_OUTPUT: ${{ runner.temp }}/qualification-results/linux-x64-appimage.json
          BRAZIER_DATA_DIR: ${{ runner.temp }}/brazier-smoke-data
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          mkdir -p "$RUNNER_TEMP/qualification-results" "$RUNNER_TEMP/brazier-smoke-user"
          chmod +x apps/desktop/dist/Brazier.AppImage
          xvfb-run -a apps/desktop/dist/Brazier.AppImage \
            --user-data-dir="$RUNNER_TEMP/brazier-smoke-user"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-release
          path: |
            apps/desktop/dist/Brazier.AppImage
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-smoke
          path: ${{ runner.temp }}/qualification-results/linux-x64-appimage.json
          if-no-files-found: error

  windows:
    needs: [validate, verify]
    runs-on: windows-latest
    # Windows packaging is experimental. Preserve a failed job for diagnosis,
    # but allow the signed macOS/Linux release to proceed.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - run: pnpm install --frozen-lockfile
      - name: Require Windows signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw 'WINDOWS_CERTIFICATE_P12 is required' }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD is required' }
      - name: Build signed NSIS distribution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          BRAZIER_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          cargo build --release --locked -p brazierd -p brazier-safety
          pnpm --filter @brazier/desktop run build
          pnpm --filter @brazier/desktop exec electron-builder --win nsis --x64 --publish never
      - name: Install and smoke-test the NSIS package
        shell: pwsh
        env:
          BRAZIER_BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
          BRAZIER_PACKAGE_SMOKE: '1'
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'qualification-results'
          $userData = Join-Path $env:RUNNER_TEMP 'brazier-smoke-user'
          $env:BRAZIER_PACKAGE_SMOKE_OUTPUT = Join-Path $results 'windows-x64-nsis.json'
          $env:BRAZIER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'brazier-smoke-data'
          New-Item -ItemType Directory -Force -Path $results, $userData | Out-Null
          Start-Process -Wait -FilePath 'apps/desktop/dist/Brazier-Setup.exe' -ArgumentList '/S'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Brazier/brazier.exe'
          if (-not (Test-Path $installed)) { throw "Installed Brazier executable not found at $installed" }
          $process = Start-Process -Wait -PassThru -FilePath $installed -ArgumentList "--user-data-dir=$userData"
          if ($process.ExitCode -ne 0) { throw "Package smoke exited with $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            apps/desktop/dist/Brazier-Setup.exe
            apps/desktop/dist/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package-smoke
          path: ${{ runner.temp }}/qualification-results/windows-x64-nsis.json
          if-no-files-found: error

  publish:
    needs: [validate, macos, appimage, windows]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        needs.macos.result == 'success' &&
        needs.appimage.result == 'success'
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true
      # Generate one machine-readable inventory for the exact source tree and
      # packaged artifacts that are about to be published. Keeping it beside
      # the installers means it is covered by the same checksums and release
      # signing process rather than disappearing into workflow-only metadata.
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/Brazier.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v3
      - name: Create checksums and Sigstore bundles
        run: |
          cd release
          mapfile -d '' assets < <(find . -maxdepth 1 -type f -printf '%f\0')
          test "${#assets[@]}" -gt 0
          sha512sum "${assets[@]}" > SHA512SUMS
          # Updater manifests remain checksum-covered. Independently sign the
          # every published artifact, including whichever platform manifests
          # are available. Windows may be absent while that build is
          # experimental, so do not require a hard-coded installer name.
          signed_assets=("${assets[@]}" SHA512SUMS)
          for asset in "${signed_assets[@]}"; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done
      - name: Publish GitHub Release and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          draft: false
          # GitHub's /releases/latest endpoint ignores prereleases. Every
          # published Brazier release is therefore a full release so the
          # README's stable download URLs always resolve.
          prerelease: false
          make_latest: true
          files: release/*
