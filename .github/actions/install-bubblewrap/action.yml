name: Install pinned Bubblewrap
description: Build and select the verified Bubblewrap version used by sandbox tests

runs:
  using: composite
  steps:
    - name: Build Bubblewrap 0.11.2
      shell: bash
      env:
        BUBBLEWRAP_VERSION: 0.11.2
        BUBBLEWRAP_SHA256: 69abc30005d2186baf7737feacd8da35633b93cf5af38838ecff17c5f8e924f6
        CC: cc
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y build-essential libcap-dev meson ninja-build pkg-config xz-utils

        archive="$RUNNER_TEMP/bubblewrap-$BUBBLEWRAP_VERSION.tar.xz"
        source_dir="$RUNNER_TEMP/bubblewrap-$BUBBLEWRAP_VERSION"
        build_dir="$RUNNER_TEMP/bubblewrap-build-$BUBBLEWRAP_VERSION"
        prefix="$RUNNER_TEMP/bubblewrap-install-$BUBBLEWRAP_VERSION"
        curl --fail --location --show-error \
          --output "$archive" \
          "https://github.com/containers/bubblewrap/releases/download/v$BUBBLEWRAP_VERSION/bubblewrap-$BUBBLEWRAP_VERSION.tar.xz"
        printf '%s  %s\n' "$BUBBLEWRAP_SHA256" "$archive" | sha256sum --check --strict -
        tar --extract --file "$archive" --directory "$RUNNER_TEMP"

        meson setup "$build_dir" "$source_dir" \
          --prefix "$prefix" \
          -Dbash_completion=disabled \
          -Dman=disabled \
          -Dselinux=disabled \
          -Dsupport_setuid=false \
          -Dtests=false \
          -Dzsh_completion=disabled
        meson compile -C "$build_dir"
        meson install -C "$build_dir"

        echo "$prefix/bin" >> "$GITHUB_PATH"
        "$prefix/bin/bwrap" --version | grep --fixed-strings --line-regexp \
          "bubblewrap $BUBBLEWRAP_VERSION"
        "$prefix/bin/bwrap" --help | grep --fixed-strings -- '--bind-fd' > /dev/null
        "$prefix/bin/bwrap" --help | grep --fixed-strings -- '--ro-bind-fd' > /dev/null
