[project]
name = "brazier-streaming-asr"
version = "0.2.0"
description = "Brazier worker for NVIDIA Nemotron-class streaming ASR"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brazier-streaming-asr = "brazier_streaming_asr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["brazier_streaming_asr*"]
