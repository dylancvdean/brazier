[package]
name = "brazier-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local model discovery, installation, execution, and tool orchestration for Brazier"

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
base64 = "0.22"
brazier-formats = { path = "../brazier-formats" }
brazier-protocol = { path = "../brazier-protocol" }
brazier-storage = { path = "../brazier-storage" }
flate2 = "1.1"
futures.workspace = true
hex.workspace = true
regex.workspace = true
reqwest.workspace = true
rquickjs = "0.12"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
tar = "0.4"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip = { version = "4.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Authorization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
axum.workspace = true
tempfile = "3.20"
