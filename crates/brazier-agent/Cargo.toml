[package]
name = "brazier-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent policy, sandboxing, worktree, and execution components for Brazier"

[features]
default = []
execution = ["dep:brazier-runtime", "dep:brazier-storage", "dep:regex"]

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
brazier-protocol = { path = "../brazier-protocol" }
brazier-runtime = { path = "../brazier-runtime", optional = true }
brazier-storage = { path = "../brazier-storage", optional = true }
futures.workspace = true
libc = "0.2"
regex = { workspace = true, optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
zbus.workspace = true
x11rb.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.20"
