[package]
name = "brazier-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent policy, sandboxing, worktree, and execution components for Brazier"

[features]
default = []
execution = ["dep:brazier-runtime", "dep:brazier-storage"]

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
brazier-protocol = { path = "../brazier-protocol" }
brazier-runtime = { path = "../brazier-runtime", optional = true }
brazier-storage = { path = "../brazier-storage", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.20"
